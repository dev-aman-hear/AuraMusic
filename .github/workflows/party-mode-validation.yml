name: Party Mode validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/online-party-mode]

jobs:
  party-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server syntax
        run: node --check party-server/server.js
      - name: Validate server package metadata
        run: node -e "const p=require('./party-server/package.json'); if (!p.scripts?.start || !p.dependencies?.ws || !p.dependencies?.express) process.exit(1)"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 defaults to the removed SDK package "tools" in some configurations.
      # v4 removes that obsolete default; keep the required packages explicit.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Compile Aura and HeyTap debug variants
        run: ./gradlew :app:compileAuraDebugKotlin :app:compileHeytapDebugKotlin --no-daemon
